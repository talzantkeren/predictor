name: CI

on:
  push:
    branches: [main, "feature/**", "claude/**"]
  pull_request:
    branches: [main, "feature/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
  SPORTS_API_PROVIDER: manual
  DEMO_MODE: "true"

jobs:
  quality:
    name: Lint, typecheck, unit tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.16.0"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install document dependencies
        run: python -m pip install -r docs/requirements-docs.txt

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Check deterministic project book
        run: npm run docs:book:check

      - name: Check submission document drift
        run: npm run docs:submission:check

      - name: Run production build
        run: npm run build

  database:
    name: Supabase database tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.16.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: npm exec -- supabase start > /dev/null

      - name: Run pgTAP tests
        run: npm run test:db

      - name: Lint database schema
        run: npm exec -- supabase db lint --local --schema public,private --level warning --fail-on error

      - name: Check generated database types
        run: npm run types:check

      - name: Stop local Supabase
        if: always()
        run: npm exec -- supabase stop

  e2e:
    name: Playwright core flows
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.16.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start local Supabase
        run: npm exec -- supabase start > /dev/null

      - name: Check client artifacts for server-only secrets
        run: npm run test:client-secrets

      - name: Run E2E core flows against the checked build
        run: npm run test:e2e:run

      - name: Stop local Supabase
        if: always()
        run: npm exec -- supabase stop

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
